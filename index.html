<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="IT系資格（ITパスポート・基本情報・応用情報）と情報Iの計算問題を、1手ずつ解く練習アプリ。通信なしで動き、記録はこの端末の中だけに残ります。">
<title>IT計算問題アプリ</title>
<style>
/* 値は 05_UI設計／01_見た目の決まり.md（第3版）の2〜4章。Webフォントは読み込まない */
:root{
  --bg:#E9EFF2;--paper:#FFFFFF;--ink:#14283A;--sub:#4A5D6C;--line:#C3D0D8;
  --accent:#0B5CAD;--accent-ink:#FFFFFF;--ok:#00704A;--ng:#B3261E;--mark:#FFE873;--soft:#DCE7EE;
  --fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A23;--paper:#1A2935;--ink:#EAF1F5;--sub:#A9BBC8;--line:#35495A;
    --accent:#7DB9F5;--accent-ink:#0B1A28;--ok:#5FD3A6;--ng:#FF9A90;--mark:#5C5112;--soft:#24384A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A23;--paper:#1A2935;--ink:#EAF1F5;--sub:#A9BBC8;--line:#35495A;
  --accent:#7DB9F5;--accent-ink:#0B1A28;--ok:#5FD3A6;--ng:#FF9A90;--mark:#5C5112;--soft:#24384A;
  color-scheme:dark;
}
:root[data-size="l"]{--fs:20px}
:root[data-size="xl"]{--fs:24px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif;
  font-size:var(--fs);line-height:1.6;letter-spacing:.05em;
  padding-bottom:calc(60px + env(safe-area-inset-bottom) + 16px);
}
body.exercising{padding-bottom:24px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--paper);padding:8px;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{line-height:1.4;margin:0 0 .5em}
h2{font-size:1.25em}
h3{font-size:1.05em}
p{margin:.4em 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 上の帯 */
.top{padding:10px 14px 0;max-width:760px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* 事務局バッジ（02_badge-draft.html の1案：開いた本の印＋縦線＋名前、角丸の枠） */
.badge{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:12px;padding:6px 12px;min-width:0}
.badge-ic{width:22px;height:18px;flex:none}
.badge-bar{width:1.5px;height:18px;background:var(--ink);flex:none}
.badge-text{font-weight:bold;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.app-name{font-size:20px;margin:12px 0 4px}
body.exercising .top{display:none}

main{max-width:760px;margin:0 auto;padding:0 14px}
main:focus{outline:none}

/* 部品 */
.btn{
  min-height:48px;border-radius:10px;padding:8px 14px;font:inherit;font-size:var(--fs);
  border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;letter-spacing:.05em;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:bold}
.btn.small{font-size:14px;padding:6px 10px}
.btn.wide{width:100%}
.btn[disabled]{cursor:default}
.opt[disabled]:not(.chosen):not(.right){color:var(--sub)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack>*+*{margin-top:12px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.mini-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.mini-cards{grid-template-columns:repeat(4,1fr)}}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mini .n{font-size:1.4em;font-weight:bold}
.mini .l{font-size:13px;color:var(--sub)}
.sub{color:var(--sub);font-size:14px}
.band{background:var(--soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.band.mark{background:var(--mark)}

/* 下のタブ（UI仕様3章） */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;height:60px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:bold;text-decoration:underline;text-underline-offset:4px}
body.exercising .tabs{display:none}

/* 演習の上の帯（UI仕様4章の0） */
.exbar{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line)}
.exbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px 14px}
.exbar .count{font-weight:bold}
.exbar .chname{color:var(--sub);font-size:14px;flex:1;text-align:right}

/* 演習 */
.step{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.step-h{font-size:13px;color:var(--sub);margin:0 0 6px;letter-spacing:.1em}
.makura{font-size:1.05em}
.qtext{white-space:pre-wrap}
.src{font-size:15px;color:var(--ink);border-left:4px solid var(--line);padding-left:10px;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%}
.opt .k{font-weight:bold;min-width:1.6em}
.opt.chosen{border:2px solid var(--accent);padding:7px 13px}
.opt.right{border:2px solid var(--ok)}
.verdict{font-weight:bold;font-size:1.1em;margin-top:10px}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--ng)}
.field{margin:12px 0}
.field label{display:block;font-size:15px;margin-bottom:4px}
.inwrap{display:flex;align-items:center;gap:8px}
.inwrap input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  font:inherit;font-size:var(--fs);padding:0 12px}
.inwrap input:focus{border:2px solid var(--accent);outline:none;padding:0 11px}
.unit{min-width:2em;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fv{font-size:15px;margin-top:4px;font-weight:bold}
.fv.ok{color:var(--ok)}
.fv.ng{color:var(--ng)}
.memo textarea{width:100%;min-height:96px;border:0;border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;padding:10px}
.steps-list{list-style:none;padding:0;margin:0}
.steps-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.steps-list li:last-child{border-bottom:0}
.steps-list .no{font-weight:bold;margin-right:.4em}
.wrong-list li.mine{font-weight:bold}
.sage{font-weight:bold;font-size:1.05em}
.stuck .chips .btn{min-width:72px}
.pre-band{background:var(--mark);border-radius:10px;padding:10px 14px;margin-top:10px}

/* 章タブ */
details.field-group{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:12px 0}
details.field-group>summary{min-height:48px;padding:12px 18px;cursor:pointer;font-weight:bold}
.chap{border-top:1px solid var(--line);padding:14px 18px}
.chap h3{margin:0 0 4px}
.tag{display:inline-block;font-size:13px;border:1px solid var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;font-weight:normal}
.formula-list dt{font-weight:bold;margin-top:10px}
.formula-list dd{margin:2px 0 0 0}

/* ルーブリック（UI仕様9章） */
.rub-views{display:grid;gap:10px}
@media (min-width:700px){.rub-views{grid-template-columns:repeat(3,1fr)}}
.rub{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rub h3{font-size:1em;margin:0 0 6px}
.bar{position:relative;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar .th{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.rub .nums{font-size:14px;margin-top:4px}
.rub .left{margin:6px 0}
.overall{margin-top:12px;font-weight:bold}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar div{aspect-ratio:1;border-radius:4px;background:var(--soft);font-size:11px;display:grid;place-items:center}
.calendar div.on{background:var(--accent);color:var(--accent-ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th,table.tbl td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-motion: no-preference){.reveal{animation:fade .2s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}

</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header class="top" id="top">
  <div class="top-row">
    <div class="badge" role="img" aria-label="学習教材コンテンツ事務局">
      <svg class="badge-ic" viewBox="0 0 24 20" aria-hidden="true"><path d="M1 3c3-1.6 6.5-1.6 10 .6V19c-3.5-2.2-7-2.2-10-.6z M13 3.6c3.5-2.2 7-2.2 10-.6v15.4c-3-1.6-6.5-1.6-10 .6z" fill="currentColor"/></svg>
      <span class="badge-bar" aria-hidden="true"></span>
      <span class="badge-text" aria-hidden="true">学習教材コンテンツ事務局</span>
    </div>
    <button type="button" class="btn small" id="themeBtn" aria-label="明るい画面と暗い画面を切り替える">表示</button>
  </div>
  <h1 class="app-name">IT計算問題アプリ</h1>
</header>
<div class="exbar" id="exbar" hidden></div>
<main id="main" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="画面の切り替え"></nav>
<div class="sr" aria-live="polite" id="live"></div>
<script id="data" type="application/json">{"chapters":[{"no":1,"name":"基数変換・補数・小数点","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論）","meaning":["ある数を、ちがう進数（2進・8進・16進）で書き直す（基数変換）","負の数や、表せる数の範囲をビットで決める（補数・表現範囲）","小数を2進数で表す、2進の小数を10進数に直す（2進小数）","計算の結果が本当の値からずれるしくみと、ずれの大きさ（誤差・桁落ち・情報落ち）"],"goal":"2進・16進と10進を行き来し、補数と誤差の計算ができる"},{"no":2,"name":"論理演算・シフト演算","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論）","meaning":["2つのビット列を、桁ごとに AND・OR・XOR・NOT で組み合わせた結果を求める（論理演算）","決まったビットだけを取り出す・反転する（マスク）","ビットを左右にずらして、2のn乗倍・2のn乗分の1にする（シフト演算）","シフトと足し算を組み合わせて、掛け算をする"],"goal":"論理演算とシフトで、ビット列の結果を求められる"},{"no":3,"name":"確率・統計・場合の数","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論）","meaning":["並べ方や選び方が何通りあるか（順列・組合せ）","あることが起こる確率（確率・余事象・加法定理・乗法定理）","平均してどれだけになるか、ばらつきはどれくらいか（期待値・平均・分散・標準偏差）","ある条件や結果が分かったときの確率（条件付き確率・ベイズの定理）"],"goal":"場合の数・確率・期待値・ばらつきを求められる"},{"no":4,"name":"情報量・データ量","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論）","meaning":["情報の単位を換える（ビットとバイト、K・M・G）","nビットで何通り表せるか（2のn乗、色数）","画像や音声のデータ量（画素・色深度、サンプリング・量子化）","データ量から時間や割合を求める（録音時間・圧縮率）"],"goal":"ビットとバイトを使い分け、画像・音声のデータ量を求められる"},{"no":5,"name":"アルゴリズムと計算量","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論／情報に関する理論）","meaning":["探索で何回比べるか（線形探索・2分探索）","並べかえの回数や計算量の増え方（バブルソート・オーダー・処理時間の見積もり）","手順をたどって結果を出す（トレース・繰返し・再帰）","データの入れ方・取り出し方（スタック・ハッシュ表）"],"goal":"探索・整列の回数と計算量を見積もり、手順をたどって結果を出せる"},{"no":6,"name":"CPU性能","field":"テクノロジ","fieldDetail":"テクノロジ（コンピュータ構成要素）","meaning":["1回の動きや1つの命令にかかる時間（クロック周期・CPI）","1秒間にどれだけの命令や計算ができるか（MIPS・FLOPS）","決まった量の処理を終えるのにかかる時間（実行時間）","台数を増やすと何倍速くなるか（高速化率・アムダールの法則）"],"goal":"クロック・CPI・MIPSから、処理にかかる時間と速さを求められる"},{"no":7,"name":"メモリ・キャッシュ","field":"テクノロジ","fieldDetail":"テクノロジ（コンピュータ構成要素）","meaning":["キャッシュに当たる・外れる割合や回数（ヒット率・ミス率・ページフォールト）","メモリを読むのに平均でかかる時間（実効アクセス時間・ミスペナルティ）","ディスクからデータを読み出すのに平均でかかる時間（平均アクセス時間）","どれだけの量を記録できるか（記憶容量）"],"goal":"ヒット率から平均の読み出し時間を求め、ディスクの時間と容量を計算できる"},{"no":8,"name":"信頼性・稼働率","field":"テクノロジ","fieldDetail":"テクノロジ（システム構成要素）","meaning":["装置やシステムが動いている割合（稼働率）","止まっている割合、または止まっている時間","どれくらいの間隔で壊れるか（MTBF・故障率・MTBSI）","止まってから直るまでの時間（MTTR・MTRS）"],"goal":"MTBF・MTTRから稼働率を求め、直列・並列の稼働率を計算できる"},{"no":9,"name":"ネットワーク・IPアドレス","field":"テクノロジ","fieldDetail":"テクノロジ（ネットワーク）","meaning":["データを送るのにかかる時間や送り方（伝送時間・伝送効率・パケットの分割）","ネットワークの番地と分け方、つなげられる機器の数（サブネットマスク・ホスト数・経路の選び方）","回線がどれだけふさがっているか、つながらない割合（呼量・呼損率）","送ったデータのうち、どれだけ誤るか（ビット誤り率）"],"goal":"伝送時間とホスト数を求め、回線の使われ方を計算できる"},{"no":10,"name":"符号・誤り検出","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論）","meaning":["誤りを見つけるために付け足す1ビットの値（パリティビット）","どんな誤りを見つけたり直したりできるか（誤り検出・訂正の力）","誤りを見つけるための合計の値（チェックサム）","データを短く表す符号の長さ（ハフマン符号）"],"goal":"パリティ・チェックサムで誤りを見つけ、符号の長さを求められる"},{"no":11,"name":"待ち行列理論","field":"テクノロジ","fieldDetail":"テクノロジ（基礎理論／応用数学）","meaning":["窓口がどれだけふさがっているか（利用率ρ）","並んで待つ平均の時間（平均待ち時間。サービス時間を含まない）","待ち時間とサービス時間を合わせた平均の時間（平均応答時間）","窓口の中にいる平均の人数（系内平均数 L）"],"goal":"利用率から、平均の待ち時間と応答時間を求められる"},{"no":12,"name":"シミュレーション","field":"ストラテジ","fieldDetail":"ストラテジ（企業活動／業務分析・データ利活用）。APはテクノロジ（基礎理論／応用数学）にも","meaning":["乱数でたくさん試して、確率や値を見積もる（モンテカルロ法）","乱数から、決めた範囲の数や出来事を作る（乱数の使い方）","3つの見積りから、かかる時間の期待値を出す（PERTの三点見積り）","本物の代わりにモデルで試す方法そのもの（シミュレーション）"],"goal":"乱数を使った見積もりのしくみが分かり、乱数から値を作れる"},{"no":13,"name":"損益分岐点","field":"ストラテジ","fieldDetail":"ストラテジ（企業活動）","meaning":["売上・費用・利益の関係から出す額（限界利益・営業利益・変動費）","利益がちょうど0になる売上高（損益分岐点売上高）","目標の利益を出すのに要る売上高や客数（目標利益売上高）","売上がどれだけ減っても赤字にならないかの割合（安全余裕率）"],"goal":"固定費と変動費から、損益分岐点と目標の売上高を求められる"},{"no":14,"name":"PL（損益計算書）","field":"ストラテジ","fieldDetail":"ストラテジ（企業活動）","meaning":["売上からどれだけもうかったか、そのために引く費用（売上総利益・営業利益・経常利益・当期純利益・販管費）","売上のうち、もうけが何％か（売上総利益率）","期末に残った商品や、まだ受け取っていない代金がいくらか（期末棚卸高・売掛金。先入先出法・総平均法・移動平均法）","売った商品の仕入れの金額がいくらか（売上原価）"],"goal":"損益計算書の5つの利益と、売上原価・期末棚卸高を求められる"},{"no":15,"name":"BS・財務指標","field":"ストラテジ","fieldDetail":"ストラテジ（企業活動）","meaning":["会社の財産と、その安全さや評価（純資産・流動比率・自己資本比率・PBR）","元手に対してどれだけもうけたか（ROE・ROA・ROIC・EVA）","売上に対するもうけや、元手の回り方（売上高利益率・資本回転率）","生み出した価値と、その分け方（付加価値・労働生産性・労働分配率）"],"goal":"貸借対照表から安全性と収益性の指標を求められる"},{"no":16,"name":"投資・回収","field":"ストラテジ","fieldDetail":"ストラテジ（企業活動）","meaning":["使ったお金を、何年で取り戻せるか（回収期間 /* ===== 1. 判定（実装計画 5-2） ===== */
const MINUS = /[−‐–—－]/g;
const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-" };
function norm(s) {
  // 2×10⁹ のような指数は「2×10^9」の形にそろえてから半角にする
  return String(s == null ? "" : s).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, m => "^" + [...m].map(c => SUP[c]).join("")).normalize("NFKC").replace(MINUS, "-")
    .replace(/\s+/g, "").replace(/,/g, "");
}
function stripUnit(s, unit) {
  const u = norm(unit);
  if (u && s.length > u.length && s.endsWith(u)) return s.slice(0, -u.length);

  const p = s.match(POW_RE);

function matchOne(input, accepted, unit) {
  const a = stripUnit(norm(input), unit);

  if (a === b) return true;
  if (FRAC_RE.test(b)) return false;            // 分数は分数の形のまま合っているときだけ

  return false;
}

  if (field.choices) return field.answers.includes(value);
  return field.answers.some(ans => matchOne(value, ans, field.unit));
}
function judgePre(input, answer) { return matchOne(input, answer, ""); }

function today(d) {
  const t = d || new Date();
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function addDays(ymd, n) { const d = new Date(ymd + "T00:00:00"); d.setDate(d.getDate() + n); return today(d); }

/* 受ける試験で出す問題を決める（設計書11章・未決13、1118_実装メモ 4章の決定）
   基本：対象試験に選んだ試験がある問題。情報Iは「情報Iの単元」が書いてある問題も基本にする
   発展：基本の1つ上の試験の問題。IP→FE・APの問題、FE→APの問題、情報I→ITパスポートの問題。
         初期設定では出さず、「発展の問題もまぜる」で出す */
function examKey() { return EXAM_KEY[S.settings.exam] || "IP"; }
function hasJ1Unit(q) { return !!q.j1 && q.j1 !== "―"; }
function inExam(q) {
  if (S.settings.exam === "J1") return q.exams.includes("情報I") || hasJ1Unit(q);
  return q.exams.includes(examKey());
}
function isAdv(q) {
  if (inExam(q)) return false;
  const ex = S.settings.exam;
  if (ex === "J1") return q.exams.includes("IP");
  if (ex === "IP") return q.exams.includes("FE") || q.exams.includes("AP");
  if (ex === "FE") return q.exams.includes("AP");
  return false;
}
function advLabel(q) {
  const ex = S.settings.exam;
  if (ex === "J1") return "発展（ITパスポート）";
  if (ex === "IP" && q.exams.includes("FE")) return "発展（基本情報）";
  return "発展（応用情報）";
}
function pool(withAdv) { return DATA.questions.filter(q => inExam(q) || (withAdv && isAdv(q))); }
function baseSet() { return DATA.questions.filter(inExam); }
/* 授業モードの間は、ふだんの記録とは別の場所に書く（UI仕様5章） */
let lessonOn = false;
function QS() { return lessonOn ? S.lesson.q : S.q; }
function DAYS() { return lessonOn ? S.lesson.days : S.days; }
function rec(id) { const Q = QS(); return Q[id] || (Q[id] = { st: "choice", seen: false, mastered: false, ok: 0, ng: 0, last: "", box: 0, due: "" }); }
function peek(id) { return QS()[id] || null; }

/* 段階の上げ下げ（設計書11章） */
function record(q, stage, ok) {
  const r = rec(q.id);
  r.seen = true;
  if (ok) {
    r.ok++; r.last = "ok";
    if (stage === "choice") { r.st = "input"; }
    else {
      if (r.mastered) r.box = Math.min(r.box + 1, INTERVALS.length - 1);
      r.mastered = true;
      r.due = addDays(today(), INTERVALS[r.box]);
    }
  } else {
    r.ng++; r.last = "ng"; r.st = "choice"; r.mastered = false; r.box = 0; r.due = "";
    if (!lessonOn) S.wrongLog.unshift({ id: q.id, at: today() });
    if (!lessonOn) S.wrongLog = S.wrongLog.slice(0, 30);
  }
  const D = DAYS();
  const d = D[today()] || (D[today()] = { n: 0, ok: 0 });
  d.n++; if (ok) d.ok++;
  if (!S.ui.firstAt) S.ui.firstAt = today();
  save();
}

/* ===== 3. ルーブリック（09_ルーブリック、UI仕様9章） ===== */
function rubric() {
  const base = baseSet();
  const N = base.length;
  const R = DATA.rubric;
  const cnt = [0, 0, 0];
  let any = false;
  for (const q of base) {
    const r = peek(q.id);
    if (!r || !r.seen) continue;
    any = true;
    cnt[0]++;
    if (r.last === "ok") cnt[1]++;
    if (r.mastered) cnt[2]++;
  }
  const views = R.views.map((v, i) => {
    const ratio = N ? cnt[i] / N : 0;
    let st = !any ? 0 : ratio >= v.th[2] ? 4 : ratio >= v.th[1] ? 3 : ratio >= v.th[0] ? 2 : 1;
    const nextTh = st >= 4 ? null : st <= 1 ? v.th[0] : v.th[st - 1];
    const left = st >= 4 ? 0 : st === 0 ? 1 : Math.max(1, Math.ceil(nextTh * N - 1e-9) - cnt[i]);
    return { name: v.name, what: v.what, next: v.next, count: cnt[i], ratio, stage: st, nextTh, left };
  });
  const overall = Math.min(...views.map(v => v.stage));
  let advSolved = 0, advOk = 0;
  for (const q of DATA.questions) if (isAdv(q)) { const r = peek(q.id); if (r && r.seen) { advSolved++; if (r.last === "ok") advOk++; } }
  return { N, views, overall, stage: R.stages[overall], advSolved, advOk };
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickIds(sel) {
  const t = today();
  let qs = pool(S.settings.mixAdv).filter(q => sel.chs.includes(q.ch));
  if (sel.mode === "rand") shuffle(qs);
  if (sel.mode === "pick") {
    const due = [], wrong = [], unseen = [], rest = [];
    for (const q of qs) {
      const r = peek(q.id);
      if (r && r.mastered && r.due && r.due <= t) due.push(q);
      else if (r && r.last === "ng") wrong.push(q);
      else if (!r || !r.seen) unseen.push(q);
      else if (!r.mastered) rest.push(q);
    }
    qs = [...due, ...wrong, ...unseen, ...rest];
  }
  if (sel.only) qs = qs.filter(sel.only);
  const n = sel.n === "all" ? qs.length : sel.n;
  return qs.slice(0, n).map(q => q.id);
}

function importData(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t);
    if (!o || o.v !== 1 || typeof o.q !== "object") throw new Error("形が違う");
    S = Object.assign(blank(), o); save(); applyLook(); say("記録を読み込みました"); render();
  }).catch(() => { say("読み込めませんでした。このアプリで書き出したファイルを選んでください"); });
}
function clearData() {
  const b = document.getElementById("clearConfirm");
  if (!b) {
    const box = h("div", { class: "band mark", id: "clearConfirm", role: "alert" },
      h("p", null, "記録をすべて消します。元に戻せません。消す前に書き出しておくと戻せます。"),
      h("div", { class: "row" },
        h("button", { type: "button", class: "btn", onclick: () => { const s = S.settings; S = blank(); S.settings = s; save(); say("記録を消しました"); render(); } }, "すべて消す"),
        h("button", { type: "button", class: "btn", onclick: () => render() }, "やめる")));
    $main.querySelector("section:last-of-type").append(box);
    box.querySelector("button").focus();
  }
}

/* 記録を残す使い方の知らせ（UI仕様11章） */
function isIOSSafari() {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  return ios && !standalone;
}
function iosBandNeeded() { return isIOSSafari() && !S.ui.iosBandClosed; }
function iosBand() {
  return h("div", { class: "band" }, h("p", null, "ホーム画面に追加すると、記録が消えにくくなります。"),
    h("div", { class: "row" },
      h("button", { type: "button", class: "btn small", onclick: () => go("settings", "howto") }, "やり方"),
      h("button", { type: "button", class: "btn small", onclick: () => { S.ui.iosBandClosed = true; save(); render(); } }, "閉じる")));
}
function exportBandNeeded() {
  const from = S.ui.exportBandClosedAt || S.ui.exportAt || S.ui.firstAt;
  return !!from && addDays(from, 14) <= today();
}
function exportBand() {
  return h("div", { class: "band" }, h("p", null, "記録を書き出しておくと、機種変更や消えたときに戻せます。"),
    h("div", { class: "row" },
      h("button", { type: "button", class: "btn small", onclick: exportData }, "書き出す"),
      h("button", { type: "button", class: "btn small", onclick: () => { S.ui.exportBandClosedAt = today(); save(); render(); } }, "閉じる")));
}

/* ===== 13. 設定 ===== */
function vSettings(arg) {
  const seg = (label, key, opts) => h("div", null, h("h3", null, label), h("div", { class: "row" }, opts.map(([v, l]) =>
    h("button", { type: "button", class: "btn small", "aria-pressed": String(S.settings[key] === v),
      onclick: () => { S.settings[key] = v; if (key === "exam") homeSel.chs = null; save(); applyLook(); render(); } }, l))));
  const box = h("div", null,
    h("section", { class: "card stack" }, h("h2", null, "設定"),
      seg("受ける試験", "exam", EXAMS.map(e => [e.id, e.name])),
      h("p", { class: "sub" }, "試験を変えても、記録は残ります。"),
      seg("文字の大きさ", "size", [["m", "標準"], ["l", "大"], ["xl", "特大"]]),
      seg("画面の明るさ", "theme", [["light", "明るい"], ["dark", "暗い"], ["auto", "端末に合わせる"]])),
    h("section", { class: "card stack", id: "howto" }, h("h2", null, "記録を残す使い方"),
      h("ul", null,
        h("li", null, "ブックマークして、毎回同じURLから開いてください。"),
        h("li", null, "iPhone・iPadは、Safariの共有ボタン（四角から矢印が出たマーク）→「ホーム画面に追加」で、ホーム画面から開いてください。"),
        h("li", null, "記録タブの「記録を書き出す」で、ファイルに残せます。別の端末では「記録を読み込む」で戻せます。")),
      h("p", { class: "sub" }, "記録はこの端末のブラウザの中だけにあります。どこにも送りません。")),
    lessonUrlCard());
  if (arg === "howto") setTimeout(() => { const el = document.getElementById("howto"); if (el) el.scrollIntoView(); }, 0);
  return box;
}

/* ===== 14. 授業モード（UI仕様5章） =====
   例：index.html#lesson&ex=FE&ch=7,9&n=10&ord=seq
   「#」より後ろはサーバーに送られない。名前などを書く項目は置かない。 */
function parseLesson(hash) {
  const parts = hash.replace(/^#/, "").split("&").filter(Boolean);
  if (parts[0] !== "lesson") return null;
  const kv = {};
  for (const p of parts.slice(1)) { const i = p.indexOf("="); if (i > 0) kv[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1)); }
  const bad = [];
  const L = { ex: null, chs: null, n: 10, ord: "seq", seed: null, st: "choice" };
  if (kv.ex != null) { if (EXAM_KEY[kv.ex]) L.ex = kv.ex; else bad.push("試験"); }
  if (kv.ch != null) {
    const list = kv.ch.split(",").map(x => Number(x));
    if (list.length && list.every(x => Number.isInteger(x) && CBY[x])) L.chs = list; else bad.push("章");
  }
  if (kv.n != null) { if (kv.n === "all") L.n = "all"; else if (["5", "10", "20", "50"].includes(kv.n)) L.n = Number(kv.n); else bad.push("問題数"); }
  if (kv.ord != null) { if (kv.ord === "seq" || kv.ord === "rand") L.ord = kv.ord; else bad.push("順番"); }
  if (kv.seed != null) { const v = Number(kv.seed); if (Number.isInteger(v) && v >= 1 && v <= 9999) L.seed = v; else bad.push("ランダムの種"); }
  if (kv.st != null) { if (kv.st === "choice" || kv.st === "input") L.st = kv.st; else bad.push("解き方"); }
  L.bad = bad;
  return L;
}
function seeded(seed) { let x = seed >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }
function lessonIds(L) {
  const prevExam = S.settings.exam;
  if (L.ex) S.settings.exam = L.ex;
  let qs = DATA.questions.filter(q => inExam(q) && (!L.chs || L.chs.includes(q.ch)));
  S.settings.exam = prevExam;
  if (L.ord === "rand") {
    const rnd = L.seed ? seeded(L.seed) : Math.random;
    for (let i = qs.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [qs[i], qs[j]] = [qs[j], qs[i]]; }
  }
  return qs.slice(0, L.n === "all" ? qs.length : L.n).map(q => q.id);
}
function lessonLabel(L) {
  const ex = EXAMS.find(e => e.id === (L.ex || S.settings.exam));
  const chs = L.chs ? L.chs.map(c => c + "章").join("と") : "全部の章";
  return `${ex ? ex.name : ""}・${chs}・${L.n === "all" ? "すべて" : L.n + "問"}`;
}
function vLesson(L) {
  const ids = lessonIds(L);
  const label = lessonLabel(L);
  return h("section", { class: "card stack", "aria-labelledby": "lh" },
    h("h2", { id: "lh" }, "先生が用意した問題です"),
    h("p", { style: "font-size:1.1em;font-weight:bold" }, `（${label}）`),
    L.bad.length ? h("p", { class: "band" }, `${L.bad.join("・")}は読めなかったので、ふだんの設定で出します。`) : null,
    h("p", { class: "sub" }, "この記録は、ふだんの記録とは分けて残します。結果はどこにも送りません。"),
    ids.length ? h("button", { type: "button", class: "btn primary wide", onclick: () => {
      history.replaceState(null, "", location.pathname + location.search);
      startSession({ lesson: { label }, st: L.st === "input" ? "input" : null }, ids);
    } }, `始める（${ids.length}問）`) : h("p", { class: "band" }, "この組み合わせで出せる問題がありません。先生に伝えてください。"),
    h("button", { type: "button", class: "btn wide", onclick: () => { history.replaceState(null, "", location.pathname + location.search); go("home"); } }, "ふだんの画面へ"));
}
let lessonMake = { ex: null, chs: [], n: 10, ord: "seq", seed: "", st: "choice" };
function lessonUrlCard() {
  const M = lessonMake;
  if (!M.ex) M.ex = S.settings.exam;
  const parts = ["lesson", "ex=" + M.ex];
  if (M.chs.length) parts.push("ch=" + M.chs.join(","));
  parts.push("n=" + M.n, "ord=" + M.ord);
  if (M.ord === "rand" && M.seed) parts.push("seed=" + M.seed);
  if (M.st === "input") parts.push("st=input");
  const url = location.href.split("#")[0] + "#" + parts.join("&");
  const seg = (label, key, opts, multi) => h("div", null, h("h3", null, label), h("div", { class: "row" }, opts.map(([v, l]) =>
    h("button", { type: "button", class: "btn small", "aria-pressed": String(multi ? M[key].includes(v) : M[key] === v),
      onclick: () => { if (multi) { const s = new Set(M[key]); s.has(v) ? s.delete(v) : s.add(v); M[key] = [...s].sort((a, b) => a - b); } else M[key] = v;
        if (key === "ord" && v === "rand" && !M.seed) M.seed = String(1 + Math.floor(Math.random() * 9999)); rerender(); } }, l))));
  return h("section", { class: "card stack", id: "lessonMake" }, h("h2", null, "授業用のURLを作る"),
    h("p", { class: "sub" }, "選んだ内容をURLに書きます。名前や出席番号は入りません。"),
    seg("試験", "ex", EXAMS.map(e => [e.id, e.name])),
    seg("章（選ばなければ全部）", "chs", DATA.chapters.map(c => [c.no, c.no + "章"]), true),
    seg("問題数", "n", [[5, "5問"], [10, "10問"], [20, "20問"], [50, "50問"], ["all", "すべて"]]),
    seg("順番", "ord", [["seq", "章の順"], ["rand", "ランダム（全員同じ順）"]]),
    seg("解き方", "st", [["choice", "4択から"], ["input", "入力から"]]),
    h("label", { for: "lessonUrl", class: "sub" }, "できたURL"),
    h("input", { id: "lessonUrl", type: "text", readonly: true, value: url, style: "width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px" }),
    h("button", { type: "button", class: "btn primary wide", onclick: () => {
      const done = () => say("URLをコピーしました");
      try { navigator.clipboard.writeText(url).then(done, () => { document.getElementById("lessonUrl").select(); document.execCommand("copy"); done(); }); }
      catch (e) { document.getElementById("lessonUrl").select(); document.execCommand("copy"); done(); }
    } }, "URLをコピー"));
}

  const dark = S.settings.theme === "dark" || (S.settings.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  S.settings.theme = dark ? "light" : "dark"; save(); applyLook();
});
load();

  if (L) { go("lesson", L); return; }
  go(S.settings.exam ? "home" : "pickExam");
}
window.addEventListener("hashchange", boot);
boot();
